<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'ChatBot - Accueil', 'accueil')}">

<div th:fragment="content" class="container py-4">
    <div class="p-5 mb-4 bg-light rounded-3 shadow-sm border">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold text-primary">
                <i class="bi bi-chat-dots"></i> Bienvenue sur Chat Bot
            </h1>
            <p class="col-md-8 fs-4 text-muted">
                Votre assistant intelligent connecté aux API Mistral et Gemini.
            </p>
            <a class="btn btn-primary btn-lg" th:href="@{/login}" role="button">
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
            </a>
        </div>
    </div>
</div>
</html>
