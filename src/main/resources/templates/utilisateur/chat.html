<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::#contenu-chat}, 'Chat Bot', 'chat')}">

<head>
    <title>Assistant IA</title>
</head>

<body>

<main id="contenu-chat" class="chat-page flex-grow-1">
    <div class="row g-3 chat-layout">

        <!-- Colonne latérale : Historique -->
        <aside class="col-12 col-md-4 col-lg-3">
            <div class="card border-0 shadow-sm h-100 sidebar-card">
                <div class="card-header bg-white border-bottom d-flex align-items-center justify-content-between py-3">
                    <span class="fw-semibold text-secondary small text-uppercase">
                        <i class="bi bi-clock-history me-1"></i> Historique
                    </span>
                    <a th:href="@{/}" class="btn btn-outline-primary btn-sm py-0 px-2" title="Nouvelle conversation">
                        <i class="bi bi-plus"></i>
                    </a>
                </div>

                <div class="list-group list-group-flush overflow-auto sidebar-list">
                    <div th:if="${conversations == null or #lists.isEmpty(conversations)}"
                         class="p-3 text-muted small text-center">
                        Aucune conversation pour le moment.
                    </div>

                    <div th:each="c : ${conversations}"
                         class="list-group-item d-flex align-items-center justify-content-between gap-2 border-0 py-2 px-3"
                         th:classappend="${conversation != null and conversation.id == c.id} ? 'active fw-semibold' : ''">

                        <a th:href="@{/conversations/{id}(id=${c.id})}"
                           th:text="${c.titre}"
                           class="text-decoration-none text-truncate flex-grow-1 small"
                           th:classappend="${conversation != null and conversation.id == c.id} ? 'text-white' : 'text-dark'">
                        </a>

                        <div class="d-flex align-items-center gap-1 flex-shrink-0">
                            <button type="button"
                                    class="btn btn-sm px-2 py-1"
                                    th:classappend="${conversation != null and conversation.id == c.id} ? 'btn-light text-dark' : 'btn-outline-secondary'"
                                    data-bs-toggle="modal"
                                    th:attr="data-bs-target='#modalRenommer-' + ${c.id}"
                                    title="Renommer">
                                ✏️
                            </button>

                            <form th:action="@{/conversations/{id}/supprimer(id=${c.id})}"
                                  method="post"
                                  class="m-0"
                                  onsubmit="return confirm('Supprimer cette conversation ?');">
                                <button type="submit"
                                        class="btn btn-sm px-2 py-1"
                                        th:classappend="${conversation != null and conversation.id == c.id} ? 'btn-danger' : 'btn-outline-danger'"
                                        title="Supprimer">
                                    🗑️
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Colonne principale : Messages + formulaire en bas -->
        <section class="col-12 col-md-8 col-lg-9 d-flex flex-column">
            <div class="card border-0 shadow-sm d-flex flex-column chat-card flex-grow-1">

                <!-- Zone des messages -->
                <div class="flex-grow-1 overflow-auto p-4 chat-messages">

                    <!-- Aucune conversation sélectionnée -->
                    <div th:if="${conversation == null}" class="welcome-box text-center my-auto mx-auto p-5">
                        <div class="display-6 text-primary mb-2">
                            <i class="bi bi-robot"></i>
                        </div>
                        <h2 class="h4 fw-bold mb-2">Comment puis-je vous aider ?</h2>
                        <p class="text-muted mb-0">
                            Choisissez un modèle IA et posez votre question ci-dessous.
                        </p>
                    </div>

                    <!-- Historique des messages -->
                    <div th:if="${conversation != null}">
                        <div th:each="message : ${messages}"
                             class="mb-3 d-flex flex-column"
                             th:classappend="${message.typeMessage.name() == 'UTILISATEUR'} ? 'align-items-end' : 'align-items-start'">

                            <span class="small text-muted mb-1 px-1"
                                  th:text="${message.typeMessage.name() == 'UTILISATEUR'} ? 'Vous' : ${conversation.modeleIA?.nom ?: 'Assistant'}">
                            </span>

                            <div class="message-bubble p-3 rounded-3 shadow-2xs"
                                 th:classappend="${message.typeMessage.name() == 'UTILISATEUR'} ? 'bg-primary text-white message-user' : 'bg-light border text-dark message-assistant'"
                                 th:text="${message.contenu}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Zone de saisie en bas -->
                <div class="border-top bg-white p-3 rounded-bottom">

                    <!-- Création d'une nouvelle conversation -->
                    <form id="formChat"
                          th:if="${conversation == null}"
                          th:action="@{/conversations}"
                          method="post">

                        <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-end gap-2">
                            <div class="model-select-wrapper">
                                <select name="idModele"
                                        class="form-select model-select"
                                        required>
                                    <option value="" disabled selected>
                                        Choisir un modèle IA
                                    </option>
                                    <option th:each="modele : ${modeles}"
                                            th:value="${modele.id}"
                                            th:text="${modele.nom}">
                                    </option>
                                </select>
                            </div>

                            <div class="flex-grow-1">
                                <textarea name="prompt"
                                          class="form-control chat-textarea"
                                          rows="2"
                                          placeholder="Posez votre question..."
                                          required></textarea>
                            </div>

                            <div class="send-button-wrapper">
                                <button class="btn btn-primary px-4" type="submit">
                                    <i class="bi bi-send me-1"></i> Envoyer
                                </button>
                            </div>
                        </div>
                    </form>

                    <!-- Conversation existante -->
                    <form th:if="${conversation != null}"
                          th:action="@{/conversations/{id}/messages(id=${conversation.id})}"
                          method="post">

                        <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-end gap-2">
                            <div class="model-current d-flex align-items-center gap-2 px-2 py-1 bg-light rounded border text-nowrap">
                                <img th:if="${conversation.modeleIA?.cheminLogo != null}"
                                     th:src="@{${conversation.modeleIA.cheminLogo}}"
                                     alt="Logo du modèle"
                                     width="24"
                                     height="24">
                                <span class="small fw-medium"
                                      th:text="${conversation.modeleIA?.nom ?: 'IA'}">
                                </span>
                            </div>

                            <div class="flex-grow-1">
                                <textarea name="prompt"
                                          class="form-control chat-textarea"
                                          rows="2"
                                          placeholder="Écrivez votre message..."
                                          required></textarea>
                            </div>

                            <div class="send-button-wrapper">
                                <button class="btn btn-primary px-4" type="submit">
                                    <i class="bi bi-send me-1"></i> Envoyer
                                </button>
                            </div>
                        </div>
                    </form>

                </div>
            </div>
        </section>

    </div>

    <!-- Modales de renommage (en dehors de .row) -->
    <div th:each="c : ${conversations}">
        <div class="modal fade text-dark fw-normal"
             th:id="'modalRenommer-' + ${c.id}"
             tabindex="-1"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/conversations/{id}/renommer(id=${c.id})}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title">Renommer la conversation</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                        </div>
                        <div class="modal-body">
                            <label class="form-label">Nouveau titre</label>
                            <input type="text"
                                   name="titre"
                                   class="form-control"
                                   th:value="${c.titre}"
                                   maxlength="50"
                                   required>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
                            <button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
