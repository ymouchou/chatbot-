<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'ChatBot - Connexion', 'login')}">

<div th:fragment="content" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0"><i class="bi bi-box-arrow-in-right"></i> Connexion</h2>
                </div>
                <div class="card-body">
                    <div th:if="${param.error}" class="alert alert-danger">
                        Identifiant ou mot de passe incorrect.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Vous avez bien été déconnecté.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Identifiant ou Email</label>
                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   name="email"
                                   placeholder="Entrez votre email"
                                   required
                                   autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe</label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Mot de passe"
                                   required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
