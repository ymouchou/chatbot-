<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" th:fragment="base(content, titre, activePage)">
<head>
    <meta charset="UTF-8">
    <title th:text="${titre} ?: 'Chat Bot'">Chat Bot</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">

    <!-- Bootstrap + Bootstrap Icons -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">

    <!-- Feuille de style de l'application -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<header th:replace="~{fragments/header :: header(${activePage})}"></header>

<!-- Contenu principal -->
<main class="container flex-grow-1 my-4">
    <div th:replace="${content}"></div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- JS Bootstrap -->
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
