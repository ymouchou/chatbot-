<div xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <header th:fragment="header(activePage)"
            sec:authorize="isAuthenticated()"
            class="bg-white border-bottom shadow-sm">
        <div class="container d-flex align-items-center justify-content-between py-2">
            <div class="d-flex align-items-center">
                <!-- Logo -->
                <a th:href="@{/}" class="me-4 navbar-brand fw-bold text-primary mb-0">
                    <i class="bi bi-robot"></i> Chat Bot
                </a>

                <!-- Menu de navigation -->
                <nav class="navbar navbar-expand p-0">
                    <ul class="navbar-nav gap-2 align-items-center">
                        <li class="nav-item">
                            <a class="nav-link px-2" th:href="@{/}"
                               th:classappend="${activePage} == 'accueil' or ${activePage} == 'chat' ? ' active fw-semibold text-primary' : ''">
                                <i class="bi bi-chat-dots"></i> Chat
                            </a>
                        </li>

                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link px-2" th:href="@{/admin/modeles-ia}"
                               th:classappend="${activePage} == 'admin' ? ' active fw-semibold text-primary' : ''">
                                <i class="bi bi-gear"></i> Gestion des modèles IA
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Utilisateur connecté + Actions à droite -->
            <div class="d-flex align-items-center gap-3">
                <div class="text-end lh-1" th:if="${utilisateur != null}">
                    <span class="small fw-semibold text-dark"
                          th:text="${utilisateur != null
                             ? utilisateur.prenom + ' ' + utilisateur.nom
                             : 'Anonyme'}">
                       Anonyme
                    </span>
                    <br>
                    <small class="text-muted"
                           th:text="${utilisateur != null
                              ? utilisateur.role.nom
                              : 'Visiteur'}">
                        Visiteur
                    </small>
                </div>

                <a th:href="@{/}" class="btn btn-primary btn-sm text-nowrap">
                    <i class="bi bi-plus-lg"></i> Nouvelle conversation
                </a>

                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-danger btn-sm text-nowrap">
                        <i class="bi bi-box-arrow-right me-1"></i> Déconnexion
                    </button>
                </form>
            </div>
        </div>
    </header>
</div>
