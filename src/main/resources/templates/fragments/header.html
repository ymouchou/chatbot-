<div xmlns:th="http://www.thymeleaf.org">
    <header th:fragment="header(activePage)" class="bg-white border-bottom shadow-sm">
        <div class="container d-flex align-items-center justify-content-between py-2">
            <div class="d-flex align-items-center">
                <!-- Logo -->
                <a th:href="@{/}" class="me-4 navbar-brand fw-bold text-primary mb-0">
                    <i class="bi bi-robot"></i> Chat Bot
                </a>

                <!-- Menu de navigation -->
                <nav class="navbar navbar-expand p-0">
                    <ul class="navbar-nav gap-2">
                        <li class="nav-item">
                            <a class="nav-link px-2" th:href="@{/}"
                               th:classappend="${activePage} == 'accueil' or ${activePage} == 'chat' ? ' active fw-semibold text-primary' : ''">
                                <i class="bi bi-chat-dots"></i> Chat
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Nouvelle conversation -->
            <a th:href="@{/}" class="btn btn-primary btn-sm text-nowrap">
                <i class="bi bi-plus-lg"></i> Nouvelle conversation
            </a>
        </div>
    </header>
</div>
