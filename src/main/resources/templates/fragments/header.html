<div xmlns:th="http://www.thymeleaf.org">
    <header th:fragment="header(activePage)" class="bg-light border-bottom">
        <div class="container d-flex align-items-center py-2">
            <!-- Logo -->
            <a th:href="@{/}" class="me-4 navbar-brand fw-bold text-primary">
                <i class="bi bi-robot"></i> Chat Bot
            </a>

            <!-- Menu de navigation -->
            <nav class="navbar navbar-expand-lg p-0">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"
                           th:classappend="${activePage} == 'accueil' ? ' active' : ''">
                            <i class="bi bi-house-door"></i> Accueil
                        </a>
                    </li>
                    <!-- D'autres liens de navigation pour le Chatbot iront ici plus tard -->
                </ul>
            </nav>
        </div>
    </header>
</div>
